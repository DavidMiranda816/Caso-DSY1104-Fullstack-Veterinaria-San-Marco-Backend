spring.application.name=veterinaria-backend

# Conexión con Oracle Autonomous Database
spring.datasource.url=jdbc:oracle:thin:@fullstackii_low?TNS_ADMIN=/home/ubuntu/oracle
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA valida las tablas; Flyway administra su estructura
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Migraciones SQL
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration